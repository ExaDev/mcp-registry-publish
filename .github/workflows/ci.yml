name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Lets a run be started by hand (gh workflow run ci.yml --ref <branch>) when no fresh pull_request or push event has fired.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # pnpm/action-setup bootstraps pnpm with `npm install`, which also audits against npm's legacy audit endpoint. That endpoint is being retired and stalled the bootstrap for five minutes in other repositories; the audit of a one-package bootstrap install tells nothing, so it is off.
  NPM_CONFIG_AUDIT: "false"

jobs:
  commitlint:
    name: Commitlint
    # The local commit-msg hook can be bypassed (a merge through the web UI, a tool that does not run hooks), so every commit on a pull request is checked here too.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  actionlint:
    name: Actionlint
    # No action wrapper: actionlint is a self-contained static binary, downloaded at a pinned version with its checksum verified, rather than trusting a third-party action.yml.
    env:
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install actionlint
        run: |
          curl -sLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" | sha256sum -c -
          tar xzf "actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" actionlint
      - run: ./actionlint -color

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run lint

  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run format:check

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run test

  # The npm package is built output, so it is built and its entry points run here: a package that builds but cannot start would otherwise only be found by the first consumer.
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run build
      - name: The built binary starts
        run: node dist/cli.js --help
      - name: The built library imports
        run: |
          node --input-type=module -e "
          const m = await import('./dist/index.js');
          if (typeof m.publishToRegistry !== 'function') process.exit(1);
          "
      - name: The package contains what its manifest names
        run: node scripts/check-packed-files.mts

  # The action run for real against a version the registry already lists: it exercises the composite action's wiring and the registry read, and stops before any login or publish. It depends on the registry being reachable, so it is deliberately not part of Required Checks.
  action-smoke:
    name: Action smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./
        with:
          server-json: test/fixtures/listed-server.json

  # A single stable branch-protection target aggregating every job that gates a merge, so the required status check does not change whenever a job is added or renamed.
  required-checks:
    name: Required Checks
    if: always()
    needs: [commitlint, actionlint, typecheck, lint, format, test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All required jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              exit 1
            fi
          done

  # Computes the next version from commits since the last tag, generates release notes and a CHANGELOG.md entry, publishes the package to npm with provenance, creates the GitHub release and version tag, and moves the major tag callers of the action pin.
  release:
    name: Release
    needs: [required-checks]
    # always() with the explicit result check: without one of always(), success(), failure() or cancelled(), GitHub ANDs the condition with success() of every needed job, and the commitlint job is skipped on push, which would skip this one too.
    if: always() && needs.required-checks.result == 'success' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Two pushes to main close together must not release at once, and cancelling one mid-publish would strand a version.
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write # the GitHub release, tags and the moving major tag
      issues: write # comments on released issues
      pull-requests: write # comments on released pull requests
      id-token: write # npm trusted publishing and provenance
    steps:
      # The release commit and tags are pushed to main, where a ruleset may require checks the job token cannot bypass, so they authenticate as the org-wide "exadev" GitHub App instead.
      - name: Generate a token for the release push
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
          # Do NOT set registry-url: it writes an .npmrc whose auth token wins over the OIDC exchange.
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Release
        # HUSKY=0 so the commit-msg hook never fires against the automated release commit.
        run: HUSKY=0 pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
